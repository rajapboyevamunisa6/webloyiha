<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale5.0">
    <title>Vazifalar Ro'yxati (To-Do App)</title>
    <style>
        /* Umumiy dizayn sozlamalari */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* Forma va input dizayni */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Vazifalar ro'yxati dizayni */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #eee;
            margin-bottom: 8px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        li span {
            cursor: pointer;
            flex: 1;
            word-break: break-all;
        }

        .delete-btn {
            background-color: #ff4d4d;
            padding: 5px 10px;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mening Vazifalarim</h2>
        
        <!-- Yangi vazifa qo'shish qismi -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Yangi vazifa kiriting...">
            <button id="addBtn">Qo'shish</button>
        </div>

        <!-- Vazifalar chiqadigan ro'yxat -->
        <ul id="taskList"></ul>
    </div>

    <script>
        // DOM elementlarini tanlab olamiz
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // Sahifa yuklanganda LocalStorage'dan ma'lumotlarni o'qib olish
        document.addEventListener('DOMContentLoaded', loadTasks);

        // Qo'shish tugmasi bosilganda
        addBtn.addEventListener('click', addTask);

        // Enter tugmasi bosilganda ham vazifa qo'shilishini ta'minlash
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // 1. Yangi vazifa qo'shish funksiyasi
        function addTask() {
            const taskText = taskInput.value.trim();

            // Agar input bo'sh bo'lmasa
            if (taskText !== "") {
                const taskObj = {
                    text: taskText,
                    completed: false
                };

                createTaskElement(taskObj);
                saveTaskToLocalStorage(taskObj);

                // Inputni tozalash
                taskInput.value = "";
            } else {
                alert("Iltimos, vazifa matnini kiriting!");
            }
        }

        // 2. HTML'ga vazifani chiqarish funksiyasi
        function createTaskElement(task) {
            const li = document.createElement('li');
            if (task.completed) {
                li.classList.add('completed');
            }

            // Vazifa matni (bosilganda bajarilgan/bajarilmagan bo'lishi uchun)
            const span = document.createElement('span');
            span.textContent = task.text;
            span.addEventListener('click', function() {
                li.classList.toggle('completed');
                updateLocalStorage();
            });

            // O'chirish tugmasi
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'O\'chirish';
            deleteBtn.classList.add('delete-btn');
            deleteBtn.addEventListener('click', function() {
                li.remove();
                updateLocalStorage();
            });

            // Elementlarni bir-biriga qo'shamiz
            li.appendChild(span);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);
        }

        // 3. LocalStorage'ga bitta vazifani saqlash
        function saveTaskToLocalStorage(task) {
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            tasks.push(task);
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // 4. LocalStorage'dan vazifalarni o'qish (sahifa yangilanganda)
        function loadTasks() {
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            tasks.forEach(task => {
                createTaskElement(task);
            });
        }

        // 5. O'zgarishlarni (o'chirish yoki holat o'zgarishi) LocalStorage'da yangilash
        function updateLocalStorage() {
            const liElements = document.querySelectorAll('li');
            let tasks = [];

            liElements.forEach(li => {
                const text = li.querySelector('span').textContent;
                const completed = li.classList.contains('completed');
                tasks.push({ text, completed });
            });

            localStorage.setItem('tasks', JSON.stringify(tasks));
        }
    </script>
</body>
</html>
